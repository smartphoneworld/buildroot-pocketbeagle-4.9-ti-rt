image shared.vfat {
        vfat {
                files = {
                        "shared_area_landmark"
                }
        }
        size = 2345M
}

image boot.vfat {
	vfat {
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"uEnv.txt",
                        "am335x-pocketbeagle.dtb"
		}
	}
	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		partition-type = 0xC
		bootable = "true"
                image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}

        partition shared {
                partition-type = 0xC
                image = "shared.vfat"
        }

}
